name: Run Tests

on:
  pull_request:
    branches:
      - main
      - develop

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: tests.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 60
    name: Execute Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v2

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v2
        with:
          node-version: 18
          cache: yarn

      - name: Install Dependencies
        id: install
        run: yarn install

      - name: Execute Test Tools
        run: yarn run test
